# Prometheus for the laptop stack (K10): both nodes' management ports every
# ten seconds, the alert rules beside it. A deployment scrapes the same path
# through the ServiceMonitor the Terraform module creates.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: kloakware
    metrics_path: /metrics
    static_configs:
      - targets: ["kloakware-1:9000", "kloakware-2:9000"]
        labels:
          cluster: kloakware
