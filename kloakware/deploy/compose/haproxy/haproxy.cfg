# The entry in front of the two kloakware nodes on a laptop: plain
# round-robin, no stickiness, each node checked on its management port. A
# request may land on either node at any step of a login, which is what
# the cluster must bear and what the sign-in tests prove.
global
    log stdout format raw local0
    maxconn 4096
    # The admin socket, inside the container only: the upgrade rehearsal
    # drains a node here before restarting it, as Kubernetes readiness does
    # for the Operator.
    stats socket /var/lib/haproxy/admin.sock mode 660 level admin

# Docker's embedded DNS: a node that comes back as a new container has a
# new address, and the proxy must look its name up again.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

defaults
    mode http
    log global
    option httplog
    option forwardfor
    # A request that cannot reach the node it was sent to goes to another:
    # a node stopping mid-request costs a retry, not an error.
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 60s
    timeout server 60s

# The rate limits at the edge (K11): one table of sources, two counters on
# each, kept for ten seconds. The token endpoint takes at most
# KLOAKWARE_EDGE_TOKEN_RATE requests per source per ten seconds and the
# login form's post, where a password is tried, KLOAKWARE_EDGE_LOGIN_RATE;
# over either, the answer is 429 and the node never sees the request. The
# realm's own brute-force detection counts failures per user and this
# counts requests per source, which is the pair: one stops a password
# being guessed, the other stops the guessing from costing a hash each.
# A load generator is one source pretending to be many, so the load
# scripts lift the two values when they bring the proxy up.
backend sources
    stick-table type ip size 100k expire 10s store http_req_rate(10s),gpc0_rate(10s)

# Which requests count. gpc0 is bumped for a login post, so its rate is
# the login rate on the same table entry.
frontend kloakware
    bind *:8080
    # The compose healthcheck reads this; nothing else does.
    monitor-uri /haproxy/health
    http-request set-header X-Forwarded-Proto http
    # The host the client named, so a node whose hostname is not fixed (the
    # test stack) builds its URLs with the port the client used.
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    # No certificate came through here: a client certificate header on the
    # plain entry is forged, and the terminator's entry below is the only
    # one that keeps it.
    http-request del-header ssl-client-cert
    http-request del-header ssl-client-verify
    acl token_endpoint path_reg ^/realms/[^/]+/protocol/openid-connect/token$
    acl login_post path_reg ^/realms/[^/]+/login-actions/authenticate
    acl is_post method POST
    http-request track-sc0 src table sources if token_endpoint or login_post
    http-request sc-inc-gpc0(0) if login_post is_post
    http-request deny deny_status 429 if token_endpoint { sc_http_req_rate(0) gt "${KLOAKWARE_EDGE_TOKEN_RATE}" }
    http-request deny deny_status 429 if login_post is_post { sc_gpc0_rate(0) gt "${KLOAKWARE_EDGE_LOGIN_RATE}" }
    default_backend nodes

# The terminator's entry: nginx has verified the client certificate and set
# the header; the source for the limits is the client nginx saw, not nginx.
# Not published to the host; the compose network and the test stack reach
# it only through the terminator.
frontend kloakware-mtls
    bind *:8081
    monitor-uri /haproxy/health
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(host)] unless { req.hdr(X-Forwarded-Host) -m found }
    acl token_endpoint path_reg ^/realms/[^/]+/protocol/openid-connect/token$
    acl login_post path_reg ^/realms/[^/]+/login-actions/authenticate
    acl is_post method POST
    http-request track-sc0 req.hdr_ip(X-Forwarded-For,1) table sources if token_endpoint or login_post
    http-request sc-inc-gpc0(0) if login_post is_post
    http-request deny deny_status 429 if token_endpoint { sc_http_req_rate(0) gt "${KLOAKWARE_EDGE_TOKEN_RATE}" }
    http-request deny deny_status 429 if login_post is_post { sc_gpc0_rate(0) gt "${KLOAKWARE_EDGE_LOGIN_RATE}" }
    default_backend nodes

backend nodes
    balance roundrobin
    # Liveness, not readiness, decides routing: readiness in Keycloak 26 also
    # reflects the embedded cluster's health, which goes DOWN on the node
    # that stays while the other leaves and rejoins. With two nodes that
    # would take the last node out of rotation at the exact moment the
    # other restarts. A live node with a database answers requests; the
    # compose healthcheck and Kubernetes keep readiness for what it is for.
    option httpchk GET /health/live
    http-check expect status 200
    # A node marked down, by a failed check or by hand, loses its open
    # connections at once, so a kept-alive client is sent to the other node.
    default-server inter 3s fall 2 rise 1 on-marked-down shutdown-sessions
    server kloakware-1 kloakware-1:8080 check port 9000 resolvers docker init-addr libc,none
    server kloakware-2 kloakware-2:8080 check port 9000 resolvers docker init-addr libc,none
