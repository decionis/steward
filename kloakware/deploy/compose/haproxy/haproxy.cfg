# The entry in front of the two kloakware nodes on a laptop: plain
# round-robin, no stickiness, each node checked on its management port. A
# request may land on either node at any step of a login, which is what
# the cluster must bear and what the sign-in tests prove.
global
    log stdout format raw local0
    maxconn 4096
    # The admin socket, inside the container only: the upgrade rehearsal
    # drains a node here before restarting it, as Kubernetes readiness does
    # for the Operator.
    stats socket /var/lib/haproxy/admin.sock mode 660 level admin

# Docker's embedded DNS: a node that comes back as a new container has a
# new address, and the proxy must look its name up again.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

defaults
    mode http
    log global
    option httplog
    option forwardfor
    # A request that cannot reach the node it was sent to goes to another:
    # a node stopping mid-request costs a retry, not an error.
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend kloakware
    bind *:8080
    # The compose healthcheck reads this; nothing else does.
    monitor-uri /haproxy/health
    http-request set-header X-Forwarded-Proto http
    default_backend nodes

backend nodes
    balance roundrobin
    # Liveness, not readiness, decides routing: readiness in Keycloak 26 also
    # reflects the embedded cluster's health, which goes DOWN on the node
    # that stays while the other leaves and rejoins. With two nodes that
    # would take the last node out of rotation at the exact moment the
    # other restarts. A live node with a database answers requests; the
    # compose healthcheck and Kubernetes keep readiness for what it is for.
    option httpchk GET /health/live
    http-check expect status 200
    # A node marked down, by a failed check or by hand, loses its open
    # connections at once, so a kept-alive client is sent to the other node.
    default-server inter 3s fall 2 rise 1 on-marked-down shutdown-sessions
    server kloakware-1 kloakware-1:8080 check port 9000 resolvers docker init-addr libc,none
    server kloakware-2 kloakware-2:8080 check port 9000 resolvers docker init-addr libc,none
