# Kloakware on a laptop: PostgreSQL, the server image built from
# ../../server/Dockerfile, and keycloak-config-cli applying the realm, then the
# dev overlay with its seeded operator and the smoke client.
#
#   cp .env.example .env            # dev-only values; edit if you like
#   docker compose up --build
#
# Admin console: http://localhost:8080/admin (the bootstrap admin from .env)
# Realm:         http://localhost:8080/realms/steward
# Mutual TLS:    https://localhost:8443/realms/steward (the terminator, K11; its CA is in the mtls volume)
# Health:        http://localhost:9000/health/ready
# Metrics:       http://localhost:9000/metrics
#
# The images are pinned by digest, the same pins the smoke test uses.
name: kloakware

# One kloakware node (K7): the image, the database, the hostname the
# browser sees and the audit listener's target. Two of these run behind the
# HAProxy that holds the name `kloakware`, discovered through jdbc-ping, the
# JGroups table in the shared database.
x-kloakware-node: &kloakware-node
  build:
    # The whole project is the context: the Dockerfile compiles the
    # extensions under ../../extensions in before Keycloak's own build.
    context: ../..
  # KLOAKWARE_IMAGE overrides the image for one `up` of one node: how the
  # upgrade rehearsal rolls the cluster (K9).
  image: ${KLOAKWARE_IMAGE:-kloakware/server:local}
  depends_on:
    db:
      condition: service_healthy
  environment: &kloakware-environment
    KC_DB_URL: jdbc:postgresql://db:5432/kloakware
    KC_DB_USERNAME: kloakware
    KC_DB_PASSWORD: ${KLOAKWARE_DB_PASSWORD:?set it in .env (see .env.example)}
    # A temporary admin, created on the first start of an empty database.
    KC_BOOTSTRAP_ADMIN_USERNAME: admin
    KC_BOOTSTRAP_ADMIN_PASSWORD: ${KLOAKWARE_BOOTSTRAP_ADMIN_PASSWORD:?set it in .env (see .env.example)}
    # The issuer Steward and the browser both see: the proxy's address. Plain
    # HTTP on a laptop only; the proxy says so in X-Forwarded-Proto.
    KC_HOSTNAME: http://localhost:8080
    KC_HTTP_ENABLED: "true"
    KC_PROXY_HEADERS: xforwarded
    # The audit listener (K5): every record to standard output, and to
    # Steward's activities endpoint, signed, when STEWARD_URL reaches it.
    KC_SPI_EVENTS_LISTENER_STEWARD_AUDIT_SINK_URL: ${STEWARD_URL:-http://localhost:3000}/api/activities/kloakware
    KC_SPI_EVENTS_LISTENER_STEWARD_AUDIT_SINK_SECRET: ${KLOAKWARE_AUDIT_WEBHOOK_SECRET:?set it in .env (see .env.example)}
    # Observability (K10): every trace to the collector beside the stack,
    # JSON on standard output for a log shipper to parse.
    KC_TRACING_ENDPOINT: http://otel-collector:4317
    KC_TRACING_SAMPLER_RATIO: "1.0"
    KC_LOG_CONSOLE_OUTPUT: json
  # Steward on the host, for the backchannel logout the realm posts to
  # STEWARD_URL: set STEWARD_URL=http://host.docker.internal:3000 to have it
  # reach a Steward running beside this stack. Docker Desktop resolves the
  # name on its own; on Linux this maps it to the host.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  healthcheck:
    # The image carries no curl; bash's /dev/tcp reaches the management port.
    test:
      [
        "CMD-SHELL",
        "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3",
      ]
    interval: 5s
    timeout: 5s
    retries: 60
    start_period: 30s

services:
  db:
    image: docker.io/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: kloakware
      POSTGRES_USER: kloakware
      POSTGRES_PASSWORD: ${KLOAKWARE_DB_PASSWORD:?set it in .env (see .env.example)}
      # Steward's own database, stood in on the same server for the
      # steward-users storage (K6); created once with the volume.
      STEWARD_DB_PASSWORD: ${STEWARD_DB_PASSWORD:?set it in .env (see .env.example)}
    volumes:
      - db:/var/lib/postgresql/data
      - ./steward-db/Init.sh:/docker-entrypoint-initdb.d/10-steward.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kloakware -d kloakware"]
      interval: 5s
      timeout: 3s
      retries: 12

  kloakware-1:
    <<: *kloakware-node
    environment:
      <<: *kloakware-environment
      KC_CACHE_EMBEDDED_NODE_NAME: kloakware-1
    ports:
      # Each node's management port, for its own health and metrics.
      - "9001:9000"

  kloakware-2:
    <<: *kloakware-node
    # After the first node: on an empty database both would race to create
    # the schema, and the loser exits. One node migrates, the others join;
    # the Operator starts nodes in turn for the same reason.
    depends_on:
      kloakware-1:
        condition: service_healthy
    environment:
      <<: *kloakware-environment
      KC_CACHE_EMBEDDED_NODE_NAME: kloakware-2
    ports:
      - "9002:9000"

  kloakware:
    # The entry: HAProxy on 8080, round-robin over the two nodes, no
    # stickiness. It carries the name every other service and Steward use.
    image: docker.io/library/haproxy:3.2-alpine@sha256:5d97434a423c2533cfeb42874d45cf6d69a840b60334582dfbfd5008e94c80be
    depends_on:
      kloakware-1:
        condition: service_healthy
      kloakware-2:
        condition: service_healthy
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8080:8080"
    environment:
      # The edge rate limits (K11), per source per ten seconds: the token
      # endpoint and the login form's post. The load scripts lift them.
      KLOAKWARE_EDGE_TOKEN_RATE: ${KLOAKWARE_EDGE_TOKEN_RATE:-300}
      KLOAKWARE_EDGE_LOGIN_RATE: ${KLOAKWARE_EDGE_LOGIN_RATE:-60}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/haproxy/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  # The certificates for mutual TLS (K11), made once into the mtls volume:
  # the stack's own authority, nginx's certificate and the steward-fapi
  # client's key pair. A deployment's come from its PKI.
  certs:
    image: docker.io/alpine/openssl:3.5.9@sha256:e8a2319d15637db5296c0ff540bb028cfabc480b22fcdd4a020582393d32673f
    entrypoint: ["/bin/sh", "/mtls/MakeCerts.sh", "/certs"]
    volumes:
      - ./mtls/MakeCerts.sh:/mtls/MakeCerts.sh:ro
      - mtls:/certs

  # The mutual-TLS terminator (K11): nginx on 8443 verifies the client's
  # certificate against the authority above and passes it to HAProxy's
  # second entry in the header kloakware's nginx lookup reads. The
  # financial-grade client's sender-constrained token is bound to it.
  kloakware-mtls:
    image: docker.io/library/nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    depends_on:
      certs:
        condition: service_completed_successfully
      kloakware:
        condition: service_healthy
    volumes:
      - ./mtls/nginx.conf:/etc/nginx/nginx.conf:ro
      - mtls:/certs:ro
    ports:
      - "8443:8443"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--no-check-certificate",
          "-O",
          "/dev/null",
          "https://127.0.0.1:8443/haproxy/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
  # at the real API, over mutual TLS.
  bankid:
    image: docker.io/library/python:3-alpine@sha256:15de367b7dfee010efaa3072f82cefc560f4544a11f620943d2a4705d04a2a4f
    command: ["python3", "-I", "/sim/Simulator.py"]
    volumes:
      - ./bankid/Simulator.py:/sim/Simulator.py:ro

  # The realm, from Git. Runs to completion; what it created before and no
  # longer finds in the file, it removes.
  ldap:
    # OpenLDAP, the directory the realm's ldap federation reads (K6): Debian's
    # slapd, seeded at start from ./ldap/Seed.ldif with one password for its
    # people and the administrator's from the environment.
    build: ./ldap
    environment:
      LDAP_ADMIN_PASSWORD: ${KLOAKWARE_LDAP_BIND_PASSWORD:?set it in .env (see .env.example)}
      LDAP_USER_PASSWORD: ${KLOAKWARE_DEV_USER_PASSWORD:?set it in .env (see .env.example)}

  # --- Observability (K10): the collector the nodes trace to, Prometheus
  # scraping both management ports with the alert rules, Grafana with the
  # dashboard provisioned. On a laptop the collector prints what it gets;
  # a deployment points its exporters at CloudWatch or Azure Monitor.
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../../observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  prometheus:
    image: docker.io/prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ../../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: docker.io/grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${KLOAKWARE_GRAFANA_ADMIN_PASSWORD:?set it in .env (see .env.example)}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Steward holds 3000 on a laptop.
      - "3001:3000"
    depends_on:
      - prometheus

  config:
    image: docker.io/adorsys/keycloak-config-cli:6.5.1-26.5.5@sha256:0955d98c8a341898b7aa177477edf8a1e90569ae50bbe7598141c1270b773274
    depends_on:
      kloakware:
        condition: service_healthy
      certs:
        condition: service_completed_successfully
    # The steward-fapi client's certificate, as made into the mtls volume,
    # is the one value the realm file takes from a file rather than from
    # the environment; a deployment passes KLOAKWARE_FAPI_CLIENT_CERTIFICATE
    # from its secret store like the rest.
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "export KLOAKWARE_FAPI_CLIENT_CERTIFICATE=$$(cat /certs/steward-fapi.der.b64) && exec java $$JAVA_OPTS -jar /app/keycloak-config-cli.jar",
      ]
    environment:
      KEYCLOAK_URL: http://kloakware:8080
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: ${KLOAKWARE_BOOTSTRAP_ADMIN_PASSWORD:?set it in .env (see .env.example)}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_FILES_LOCATIONS: /config/corp.json,/config/steward.json
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      # Re-applying an unchanged file must still converge the realm (K2: drift).
      IMPORT_CACHE_ENABLED: "false"
      STEWARD_URL: ${STEWARD_URL:-http://localhost:3000}
      KLOAKWARE_BANKID_URL: http://bankid:8090
      # The brokers (K6): the browser reaches the corp realm at the public URL,
      # the server reaches it at its own; the broker client's secret; the
      # ldap bind and the Steward database read the realm's storages use.
      KLOAKWARE_PUBLIC_URL: http://localhost:8080
      KLOAKWARE_INTERNAL_URL: http://localhost:8080
      KLOAKWARE_BROKER_CLIENT_SECRET: ${KLOAKWARE_BROKER_CLIENT_SECRET:?set it in .env (see .env.example)}
      KLOAKWARE_LDAP_BIND_PASSWORD: ${KLOAKWARE_LDAP_BIND_PASSWORD:?set it in .env (see .env.example)}
      STEWARD_DB_PASSWORD: ${STEWARD_DB_PASSWORD:?set it in .env (see .env.example)}
      KLOAKWARE_STEWARD_CLIENT_SECRET: ${KLOAKWARE_STEWARD_CLIENT_SECRET:?set it in .env (see .env.example)}
      KLOAKWARE_STEWARD_API_SECRET: ${KLOAKWARE_STEWARD_API_SECRET:?set it in .env (see .env.example)}
    volumes:
      - ../../config/realms/corp.json:/config/corp.json:ro
      - ../../config/realms/steward.json:/config/steward.json:ro
      - mtls:/certs:ro

  # The master realm's one addition (K11): the kloakware-ci service account
  # the promotion pipeline applies the realms as, with the two realms'
  # management roles and nothing of master's. Applied after the realms,
  # since master's per-realm clients exist only once the realms do, and
  # without deleting what else master holds.
  config-master:
    image: docker.io/adorsys/keycloak-config-cli:6.5.1-26.5.5@sha256:0955d98c8a341898b7aa177477edf8a1e90569ae50bbe7598141c1270b773274
    depends_on:
      config:
        condition: service_completed_successfully
    environment:
      KEYCLOAK_URL: http://kloakware:8080
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: ${KLOAKWARE_BOOTSTRAP_ADMIN_PASSWORD:?set it in .env (see .env.example)}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      IMPORT_FILES_LOCATIONS: /config/master.json
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      IMPORT_CACHE_ENABLED: "false"
      IMPORT_MANAGED_CLIENT: no-delete
      KLOAKWARE_CI_CLIENT_SECRET: ${KLOAKWARE_CI_CLIENT_SECRET:?set it in .env (see .env.example)}
    volumes:
      - ../../config/realms/master.json:/config/master.json:ro

  # The dev overlay: plain HTTP accepted on the master and steward realms (a
  # laptop has no TLS, and Docker Desktop may present the host's traffic from
  # an address outside the private ranges, which "external" refuses), the
  # seeded operator and the smoke client. Laptop and CI only; a deployment
  # never runs this. It must not remove the realm's clients it does not
  # mention, hence no-delete.
  config-dev:
    image: docker.io/adorsys/keycloak-config-cli:6.5.1-26.5.5@sha256:0955d98c8a341898b7aa177477edf8a1e90569ae50bbe7598141c1270b773274
    depends_on:
      config-master:
        condition: service_completed_successfully
    environment:
      KEYCLOAK_URL: http://kloakware:8080
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: ${KLOAKWARE_BOOTSTRAP_ADMIN_PASSWORD:?set it in .env (see .env.example)}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      IMPORT_FILES_LOCATIONS: /config/dev/master-dev.json,/config/dev/steward-dev.json,/config/dev/corp-dev.json
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      # Re-applying an unchanged file must still converge the realm (K2: drift).
      IMPORT_CACHE_ENABLED: "false"
      IMPORT_MANAGED_CLIENT: no-delete
      KLOAKWARE_DEV_USER_PASSWORD: ${KLOAKWARE_DEV_USER_PASSWORD:?set it in .env (see .env.example)}
    volumes:
      - ../../config/realms/dev:/config/dev:ro

volumes:
  db: {}
  mtls: {}
