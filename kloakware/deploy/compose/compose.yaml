# Kloakware on a laptop: PostgreSQL, the server image built from
# ../../server/Dockerfile, and keycloak-config-cli applying the realm, then the
# dev overlay with its seeded operator and the smoke client.
#
#   cp .env.example .env            # dev-only values; edit if you like
#   docker compose up --build
#
# Admin console: http://localhost:8080/admin (the bootstrap admin from .env)
# Realm:         http://localhost:8080/realms/steward
# Health:        http://localhost:9000/health/ready
# Metrics:       http://localhost:9000/metrics
#
# The images are pinned by digest, the same pins the smoke test uses.
name: kloakware

services:
  db:
    image: docker.io/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: kloakware
      POSTGRES_USER: kloakware
      POSTGRES_PASSWORD: ${KLOAKWARE_DB_PASSWORD:?set it in .env (see .env.example)}
      # Steward's own database, stood in on the same server for the
      # steward-users storage (K6); created once with the volume.
      STEWARD_DB_PASSWORD: ${STEWARD_DB_PASSWORD:?set it in .env (see .env.example)}
    volumes:
      - db:/var/lib/postgresql/data
      - ./steward-db/Init.sh:/docker-entrypoint-initdb.d/10-steward.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kloakware -d kloakware"]
      interval: 5s
      timeout: 3s
      retries: 12

  kloakware:
    build:
      # The whole project is the context: the Dockerfile compiles the
      # extensions under ../../extensions in before Keycloak's own build.
      context: ../..
    image: kloakware/server:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      KC_DB_URL: jdbc:postgresql://db:5432/kloakware
      KC_DB_USERNAME: kloakware
      KC_DB_PASSWORD: ${KLOAKWARE_DB_PASSWORD:?set it in .env (see .env.example)}
      # A temporary admin, created on the first start of an empty database.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KLOAKWARE_BOOTSTRAP_ADMIN_PASSWORD:?set it in .env (see .env.example)}
      # The issuer Steward and the browser both see. Plain HTTP on a laptop only.
      KC_HOSTNAME: http://localhost:8080
      KC_HTTP_ENABLED: "true"
      # The audit listener (K5): every record to standard output, and to
      # Steward's activities endpoint, signed, when STEWARD_URL reaches it.
      KC_SPI_EVENTS_LISTENER_STEWARD_AUDIT_SINK_URL: ${STEWARD_URL:-http://localhost:3000}/api/activities/kloakware
      KC_SPI_EVENTS_LISTENER_STEWARD_AUDIT_SINK_SECRET: ${KLOAKWARE_AUDIT_WEBHOOK_SECRET:?set it in .env (see .env.example)}
    ports:
      - "8080:8080"
      - "9000:9000"
    # Steward on the host, for the backchannel logout the realm posts to
    # STEWARD_URL: set STEWARD_URL=http://host.docker.internal:3000 to have it
    # reach a Steward running beside this stack. Docker Desktop resolves the
    # name on its own; on Linux this maps it to the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # The image carries no curl; bash's /dev/tcp reaches the management port.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # The BankID simulator (K5): the Relying Party API in shape only, for the
  # market second factor on a laptop. A deployment points KLOAKWARE_BANKID_URL
  # at the real API, over mutual TLS.
  bankid:
    image: docker.io/library/python:3-alpine@sha256:15de367b7dfee010efaa3072f82cefc560f4544a11f620943d2a4705d04a2a4f
    command: ["python3", "-I", "/sim/Simulator.py"]
    volumes:
      - ./bankid/Simulator.py:/sim/Simulator.py:ro

  # The realm, from Git. Runs to completion; what it created before and no
  # longer finds in the file, it removes.
  ldap:
    # OpenLDAP, the directory the realm's ldap federation reads (K6): Debian's
    # slapd, seeded at start from ./ldap/Seed.ldif with one password for its
    # people and the administrator's from the environment.
    build: ./ldap
    environment:
      LDAP_ADMIN_PASSWORD: ${KLOAKWARE_LDAP_BIND_PASSWORD:?set it in .env (see .env.example)}
      LDAP_USER_PASSWORD: ${KLOAKWARE_DEV_USER_PASSWORD:?set it in .env (see .env.example)}

  config:
    image: docker.io/adorsys/keycloak-config-cli:6.5.1-26.5.5@sha256:0955d98c8a341898b7aa177477edf8a1e90569ae50bbe7598141c1270b773274
    depends_on:
      kloakware:
        condition: service_healthy
    environment:
      KEYCLOAK_URL: http://kloakware:8080
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: ${KLOAKWARE_BOOTSTRAP_ADMIN_PASSWORD:?set it in .env (see .env.example)}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_FILES_LOCATIONS: /config/corp.json,/config/steward.json
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      # Re-applying an unchanged file must still converge the realm (K2: drift).
      IMPORT_CACHE_ENABLED: "false"
      STEWARD_URL: ${STEWARD_URL:-http://localhost:3000}
      KLOAKWARE_BANKID_URL: http://bankid:8090
      # The brokers (K6): the browser reaches the corp realm at the public URL,
      # the server reaches it at its own; the broker client's secret; the
      # ldap bind and the Steward database read the realm's storages use.
      KLOAKWARE_PUBLIC_URL: http://localhost:8080
      KLOAKWARE_INTERNAL_URL: http://localhost:8080
      KLOAKWARE_BROKER_CLIENT_SECRET: ${KLOAKWARE_BROKER_CLIENT_SECRET:?set it in .env (see .env.example)}
      KLOAKWARE_LDAP_BIND_PASSWORD: ${KLOAKWARE_LDAP_BIND_PASSWORD:?set it in .env (see .env.example)}
      STEWARD_DB_PASSWORD: ${STEWARD_DB_PASSWORD:?set it in .env (see .env.example)}
      KLOAKWARE_STEWARD_CLIENT_SECRET: ${KLOAKWARE_STEWARD_CLIENT_SECRET:?set it in .env (see .env.example)}
      KLOAKWARE_STEWARD_API_SECRET: ${KLOAKWARE_STEWARD_API_SECRET:?set it in .env (see .env.example)}
    volumes:
      - ../../config/realms/corp.json:/config/corp.json:ro
      - ../../config/realms/steward.json:/config/steward.json:ro

  # The dev overlay: plain HTTP accepted on the master and steward realms (a
  # laptop has no TLS, and Docker Desktop may present the host's traffic from
  # an address outside the private ranges, which "external" refuses), the
  # seeded operator and the smoke client. Laptop and CI only; a deployment
  # never runs this. It must not remove the realm's clients it does not
  # mention, hence no-delete.
  config-dev:
    image: docker.io/adorsys/keycloak-config-cli:6.5.1-26.5.5@sha256:0955d98c8a341898b7aa177477edf8a1e90569ae50bbe7598141c1270b773274
    depends_on:
      config:
        condition: service_completed_successfully
    environment:
      KEYCLOAK_URL: http://kloakware:8080
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: ${KLOAKWARE_BOOTSTRAP_ADMIN_PASSWORD:?set it in .env (see .env.example)}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      IMPORT_FILES_LOCATIONS: /config/dev/master-dev.json,/config/dev/steward-dev.json,/config/dev/corp-dev.json
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      # Re-applying an unchanged file must still converge the realm (K2: drift).
      IMPORT_CACHE_ENABLED: "false"
      IMPORT_MANAGED_CLIENT: no-delete
      KLOAKWARE_DEV_USER_PASSWORD: ${KLOAKWARE_DEV_USER_PASSWORD:?set it in .env (see .env.example)}
    volumes:
      - ../../config/realms/dev:/config/dev:ro

volumes:
  db: {}
