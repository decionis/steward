# The SiteMinder agent, stood in (K13): the applications behind a SiteMinder
# web agent never saw a token, they read the headers the agent set, SM_USER
# above all. During the migration the agent is replaced by a shim that
# verifies kloakware's token and sets the same headers, so the applications
# move last and unchanged. This one verifies the realm's RS256 signature
# with the key its entrypoint fetched, refuses what is expired or for
# another audience, sets the headers, and, standing in for the application
# too, echoes them back. A deployment puts the real application behind
# `default_backend` instead of the return.
global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend legacy-app
    bind *:8082
    monitor-uri /agent/health

    http-request set-var(txn.bearer) http_auth_bearer
    http-request set-var(txn.alg) var(txn.bearer),jwt_header_query('$.alg')
    http-request set-var(txn.exp) var(txn.bearer),jwt_payload_query('$.exp','int')
    http-request set-var(txn.now) date()
    http-request set-var(txn.aud) var(txn.bearer),jwt_payload_query('$.aud')

    # No token, a token not signed RS256 by the realm's key, an expired one,
    # or one meant for another audience: refused as the agent refused a
    # missing SMSESSION, before the application is reached.
    http-request return status 401 content-type text/plain lf-string "no bearer token\n" unless { var(txn.bearer) -m found }
    http-request return status 401 content-type text/plain lf-string "not RS256\n" unless { var(txn.alg) -m str RS256 }
    http-request return status 401 content-type text/plain lf-string "bad signature\n" unless { var(txn.bearer),jwt_verify(txn.alg,"/tmp/realm.pem") -m int 1 }
    http-request return status 401 content-type text/plain lf-string "expired\n" unless { var(txn.exp),sub(txn.now) -m int gt 0 }
    http-request return status 401 content-type text/plain lf-string "not for this application\n" unless { var(txn.aud) -m sub legacy-dashboard }

    # The agent's headers, from the token's claims: the user as the
    # application knew them, and what the realm says about them, the lists
    # as the comma-separated values a SiteMinder response would have set.
    http-request set-header SM_USER %[var(txn.bearer),jwt_payload_query('$.preferred_username')]
    http-request set-header SM_USEREMAIL %[var(txn.bearer),jwt_payload_query('$.email')]
    http-request set-header SM_USERDN %[var(txn.bearer),jwt_payload_query('$.sub')]
    http-request set-header SM_ROLES %[var(txn.bearer),jwt_payload_query('$.steward.roles'),regsub('[][\x22]','','g')]
    http-request set-header SM_MARKETS %[var(txn.bearer),jwt_payload_query('$.steward.markets'),regsub('[][\x22]','','g')]
    http-request del-header Authorization

    # The application, stood in: what it would have received.
    http-request return status 200 content-type text/plain lf-string "SM_USER=%[req.fhdr(SM_USER)]\nSM_USEREMAIL=%[req.fhdr(SM_USEREMAIL)]\nSM_USERDN=%[req.fhdr(SM_USERDN)]\nSM_ROLES=%[req.fhdr(SM_ROLES)]\nSM_MARKETS=%[req.fhdr(SM_MARKETS)]\n"
