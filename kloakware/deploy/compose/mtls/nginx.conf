# The mutual-TLS terminator in front of the proxy (K11): the client's
# certificate, verified against the stack's own authority, is passed to
# kloakware URL-encoded in the header its nginx certificate lookup reads,
# and the request goes on to HAProxy's second entry, the one that keeps
# that header. The plain entry on 8080 strips it, so a certificate can
# only arrive through here. A deployment's ingress does the same with
# auth-tls annotations; this is the laptop's.
events {}

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  server {
    listen 8443 ssl;
    server_name localhost kloakware-mtls;

    ssl_certificate /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # A certificate is asked for, not demanded: the login page and the
    # clients that are not sender-constrained need none. One that fails
    # verification is refused here, before anything downstream could
    # mistake it for a verified one.
    ssl_client_certificate /certs/ca.crt;
    ssl_verify_client optional;
    ssl_verify_depth 2;

    location / {
      if ($ssl_client_verify !~ "^(NONE|SUCCESS)$") {
        return 495;
      }
      proxy_pass http://kloakware:8081;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header ssl-client-cert $ssl_client_escaped_cert;
      proxy_set_header ssl-client-verify $ssl_client_verify;
      proxy_read_timeout 60s;
    }
  }
}
