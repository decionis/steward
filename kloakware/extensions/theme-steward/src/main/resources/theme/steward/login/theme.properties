# The login theme: Keycloak's own keycloak.v2 with Steward's stylesheet on
# top and the three languages the markets speak. Nothing of the parent's
# templates is copied; a release's changes to them arrive with the release.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/steward.css
locales=en,sv,de
