name: Release

# Produces a deployable bundle with the two artifacts an enterprise buyer's
# procurement process increasingly requires as a hard gate rather than a
# differentiator:
#
#   1. A CycloneDX SBOM, generated from the actual resolved tree on the target
#      platform rather than from package.json. The repository's checked-in
#      inventory is macOS-generated and platform-conditional (@img/sharp-* and
#      @next/swc-* resolve per-architecture), so only an SBOM built here matches
#      what actually ships.
#   2. A signed SLSA build-provenance attestation binding the tarball to this
#      workflow, this commit, and this runner — so a recipient can verify the
#      artifact came from this source and not from someone's laptop.
#
# Run it by pushing a v* tag, or manually with dry_run to exercise the whole
# pipeline without publishing a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and attest, but do not create a release"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build, attest, publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the release
      id-token: write # sigstore signing for provenance
      attestations: write # record the attestation

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        # Never publish an artifact that would not have passed the PR gate.
        run: pnpm verify

      - name: Re-check supply chain at release time
        # The tree passed on merge; that may have been weeks ago.
        run: |
          pnpm audit --prod
          pnpm licenses:check

      - name: Assemble the deployable bundle
        id: bundle
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || version="0.0.0-${GITHUB_SHA:0:7}"
          name="decionis-steward-${version}"

          # next.config.ts sets output: "standalone". That directory is not
          # self-sufficient — the static assets are emitted separately and must
          # be placed alongside it for the bundled server to serve them.
          mkdir -p "dist/${name}"
          cp -R .next/standalone/. "dist/${name}/"
          mkdir -p "dist/${name}/.next"
          cp -R .next/static "dist/${name}/.next/static"
          [ -d public ] && cp -R public "dist/${name}/public" || true

          tar -czf "${name}.tar.gz" -C dist "${name}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "bundle=dist/${name}" >> "$GITHUB_OUTPUT"
          echo "tarball=${name}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "${name}.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Generate CycloneDX SBOM
        # Generated from `pnpm licenses list --prod` rather than scanned off the
        # filesystem. Two attempts with Syft produced, in order, 566 components
        # (the whole workspace, dev tooling included) and then zero — pnpm keeps
        # the real packages under node_modules/.pnpm behind symlinks, and
        # neither a directory scan nor an archive scan resolved them. v0.1.0
        # shipped the empty one.
        #
        # pnpm already knows the production set, so the SBOM and the published
        # ThirdPartyLicenses.md are generated from the same source and cannot
        # disagree. It also removes a third-party action from the release path.
        run: node scripts/GenerateSbom.mjs "decionis-steward-${{ steps.bundle.outputs.version }}.cdx.json" "${{ steps.bundle.outputs.version }}"

      - name: Assert the SBOM describes something
        # The generator refuses to write an empty document, but this asserts the
        # artifact on disk independently. v0.1.0 shipped a 419-byte SBOM with
        # zero components: it passed every schema check and answered nothing,
        # and nothing caught it until someone opened the file.
        env:
          SBOM: "decionis-steward-${{ steps.bundle.outputs.version }}.cdx.json"
        run: |
          set -euo pipefail
          count=$(node -e "process.stdout.write(String((JSON.parse(require('fs').readFileSync(process.env.SBOM,'utf8')).components||[]).length))")
          echo "SBOM components: ${count}"
          if [ "${count}" -lt 5 ]; then
            echo "::error title=SBOM is effectively empty::Only ${count} components."
            exit 1
          fi

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.bundle.outputs.tarball }}

      - name: Publish the attestation alongside the artifact
        # The attestation is already stored by GitHub and `gh attestation verify`
        # finds it there. Attaching the Sigstore bundle to the release as well
        # means it can be verified from the downloaded files alone:
        #
        #   gh attestation verify decionis-steward-<version>.tar.gz \
        #     --bundle decionis-steward-<version>.sigstore.json --repo decionis/steward
        #
        # That matters for an air-gapped or mirrored consumer, and for anyone
        # archiving a release: the tarball, its SBOM and its provenance travel
        # together instead of one of the three living only in an API.
        #
        # The .sigstore.json name is what the file is, and is also one of the
        # suffixes OpenSSF Scorecard's Signed-Releases check recognises. That
        # check scored 0 here while the provenance was real but unpublished —
        # correctly, since it inspects release assets and there was nothing to
        # find. Do not rename this to .intoto.jsonl to satisfy the other probe:
        # a Sigstore bundle is not in-toto JSON Lines, and the filename should
        # describe the contents.
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "decionis-steward-${VERSION}.sigstore.json"

          # Also emit the signed DSSE envelope as in-toto JSON Lines, the
          # format SLSA tooling and Scorecard's provenance probe expect. This is
          # a format conversion, not a rename: the envelope's payloadType is
          # application/vnd.in-toto+json and its payload is an in-toto
          # Statement v1 carrying a slsa.dev/provenance/v1 predicate. One
          # envelope, so one line.
          node -e '
            const fs = require("fs");
            const bundle = JSON.parse(fs.readFileSync(process.env.BUNDLE, "utf8"));
            const envelope = bundle.dsseEnvelope;
            if (!envelope) throw new Error("attestation bundle has no dsseEnvelope");
            const payload = JSON.parse(
              Buffer.from(envelope.payload, "base64").toString("utf8"),
            );
            if (payload._type !== "https://in-toto.io/Statement/v1") {
              throw new Error("payload is not an in-toto Statement v1: " + payload._type);
            }
            fs.writeFileSync(
              `decionis-steward-${process.env.VERSION}.intoto.jsonl`,
              JSON.stringify(envelope) + "\n",
            );
            console.log("in-toto statement subject:", payload.subject[0].name);
          '

      - name: Upload artifacts for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.bundle.outputs.version }}
          path: |
            ${{ steps.bundle.outputs.tarball }}
            decionis-steward-${{ steps.bundle.outputs.version }}.cdx.json
            decionis-steward-${{ steps.bundle.outputs.version }}.sigstore.json
            decionis-steward-${{ steps.bundle.outputs.version }}.intoto.jsonl
          retention-days: 30

      - name: Publish release
        if: github.event_name == 'push' && github.ref_type == 'tag' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bundle.outputs.version }}
          TARBALL: ${{ steps.bundle.outputs.tarball }}
          DIGEST: ${{ steps.bundle.outputs.sha256 }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          ## Artifacts

          | File | What it is |
          | ---- | ---------- |
          | `__TARBALL__` | Deployable Next.js standalone bundle |
          | `decionis-steward-__VERSION__.cdx.json` | CycloneDX SBOM of the resolved production tree |
          | `decionis-steward-__VERSION__.sigstore.json` | Sigstore bundle for the provenance attestation |
          | `decionis-steward-__VERSION__.intoto.jsonl` | The same attestation as a signed in-toto statement |

          SHA-256 of the tarball:

          ```
          __DIGEST__
          ```

          ## Verifying provenance

          This build carries a signed SLSA provenance attestation. Verify it against
          this repository before deploying:

          ```bash
          gh attestation verify __TARBALL__ --repo decionis/steward
          ```

          That confirms the artifact was produced by this workflow from this commit,
          not rebuilt elsewhere.

          The attestation is also attached here, so it can be verified from the
          downloaded files alone without reaching GitHub's attestation API:

          ```bash
          gh attestation verify __TARBALL__ \
            --bundle decionis-steward-__VERSION__.sigstore.json --repo decionis/steward
          ```

          ## Licensing

          Apache-2.0. Third-party components are inventoried in ThirdPartyLicenses.md;
          the SBOM attached here is the deployment-accurate equivalent, generated on
          the Linux build platform.
          NOTES

          # Pure bash rather than sed -i, whose in-place syntax differs between
          # GNU and BSD; this also stays testable on a developer's machine.
          notes=$(cat notes.md)
          notes=${notes//__TARBALL__/$TARBALL}
          notes=${notes//__VERSION__/$VERSION}
          notes=${notes//__DIGEST__/$DIGEST}
          printf '%s\n' "$notes" > notes.md

          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Decionis Steward ${VERSION}" \
            --notes-file notes.md \
            "${TARBALL}" \
            "decionis-steward-${VERSION}.cdx.json" \
            "decionis-steward-${VERSION}.sigstore.json" \
            "decionis-steward-${VERSION}.intoto.jsonl"
