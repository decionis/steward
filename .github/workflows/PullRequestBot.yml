name: Pull request bot

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: Optional same-repository branch to evaluate
        required: false
        type: string
      creation_run_id:
        description: Optional create-event workflow run proving branch ownership
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: steward-pr-bot
  cancel-in-progress: false

jobs:
  open-pull-request:
    if: vars.PR_BOT_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Check out the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: read
          permission-pull-requests: write
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
      - name: Open qualifying pull requests
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_AUTHOR_LOGIN: ocularminds
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/OpenPullRequest.mjs
