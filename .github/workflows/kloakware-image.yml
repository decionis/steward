name: Kloakware image

# The kloakware image, published to GHCR so the Keycloak resource under
# kloakware/deploy/terraform can pull it: on every merge to master as
# `master` and `sha-<commit>`, on every kloakware tag as its version. Built
# from kloakware/Dockerfile with the extensions compiled in, as the tests
# build it; one platform, the x86 nodes EKS and AKS run here.

on:
  push:
    branches: [master]
    tags: ["kloakware-v*"]
    paths:
      - "kloakware/Dockerfile"
      - "kloakware/.dockerignore"
      - "kloakware/pom.xml"
      - "kloakware/extensions/**"
      - ".github/workflows/kloakware-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: kloakware-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tags
        id: plan
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kloakware"
          short="${GITHUB_SHA::7}"
          if [ "$REF_TYPE" = "tag" ]; then
            tags="$image:${REF_NAME#kloakware-v},$image:sha-$short"
          else
            tags="$image:master,$image:sha-$short"
          fi
          {
            echo "image=$image"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push
        id: publish
        env:
          TAGS: ${{ steps.plan.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          IFS=',' read -ra list <<< "$TAGS"
          for t in "${list[@]}"; do args+=(-t "$t"); done
          docker buildx create --use --name kloakware >/dev/null
          docker buildx build --platform linux/amd64 \
            --sbom=true --provenance=mode=max \
            "${args[@]}" --push kloakware
          digest="$(docker buildx imagetools inspect "${list[0]}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "::notice::Published ${list[0]} at $digest"
