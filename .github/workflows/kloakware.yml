name: Kloakware

# The gate for the access service under kloakware/: the Maven build, the
# license allowlist, and the smoke test, which builds the server image, starts
# it against PostgreSQL, applies the realm with keycloak-config-cli and signs
# the seeded operator in. Path-filtered so a change to Steward does not build
# kloakware and a change to kloakware does not run `pnpm verify`.
#
# Every third-party action is pinned to a commit SHA, as in verify.yml.

on:
  push:
    branches: [master]
    paths:
      - "kloakware/**"
      - ".github/workflows/kloakware.yml"
  pull_request:
    paths:
      - "kloakware/**"
      - ".github/workflows/kloakware.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kloakware-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (java 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        # The server image runs Java 21; the build is proven on the same level.
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify
        # compile -> test (the smoke test, through Testcontainers on the
        # runner's Docker) -> the license gate.
        run: mvn --batch-mode --no-transfer-progress --file kloakware/pom.xml verify

  drift:
    name: drift (terraform)
    # The Terraform half of configuration as code: the market realms apply
    # clean, a change by hand is detected, the next apply converges. The
    # config-cli half is RealmConvergenceTest, under verify.
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -diff -recursive kloakware/config/terraform

      - name: Drift
        run: kloakware/config/drift/CheckDrift.sh

  sign-in:
    name: sign-in (steward through kloakware)
    # The whole sign-in against the real pair: Steward in live mode, built
    # here, and kloakware from the compose file with the dev overlay. Proves
    # the redirect out, the login page, the redirect back, the session, the
    # issuer's backchannel logout and Steward's sign-out (K3).
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start kloakware
        # The realm redirects to, and posts the backchannel logout to, Steward
        # on the runner, reached from the container as host.docker.internal.
        working-directory: kloakware/deploy/compose
        env:
          STEWARD_URL: http://host.docker.internal:3000
        run: |
          docker compose --env-file .env.example up --build --wait --wait-timeout 300
          docker wait "$(docker compose --env-file .env.example ps -aq config-dev)"

      - name: Build Steward
        run: pnpm build

      - name: Sign in, end to end
        env:
          STEWARD_URL: http://host.docker.internal:3000
        run: test/e2e/RunKloakwareSignIn.sh

      - name: Stop kloakware
        if: always()
        working-directory: kloakware/deploy/compose
        run: docker compose --env-file .env.example down --volumes --remove-orphans
