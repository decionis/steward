name: Scorecard

# OpenSSF Scorecard grades this repository's supply-chain posture against a
# published rubric — pinned dependencies, branch protection, token permissions,
# signed releases, CI tests, dangerous workflow patterns.
#
# The point is that it is somebody else's rubric. Procurement can cite a
# third-party number instead of taking our word for the posture, which is a
# large part of why open-sourcing this tier is worth doing at all.
#
# Runs on every push to master, on branch-protection changes, and weekly, with
# publish_results on so results reach the public OpenSSF API and the badge in
# README.md resolves.
#
# It was workflow_dispatch-only while this repository was internal, because a
# score nobody could see was not worth the CI minutes.
#
# It also failed then with "Resource not accessible by integration", which was
# read at the time as an entitlement problem that going public would solve. It
# was not: the job simply lacked the permissions Scorecard needs. Going public
# changed nothing about it. See the permissions block below.
on:
  branch_protection_rule:
  push:
    branches: [master]
  schedule:
    # Wednesdays 05:00 UTC — offset from the dependency audit (Mon) and CodeQL
    # (Tue) so the three signals arrive separately.
    - cron: "0 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      id-token: write # required by publish_results
      actions: read # Scorecard reads workflow runs to score CI-Tests
      # Scorecard's ListCommits query walks commits together with the pull
      # requests and reviews attached to them, which is how Branch-Protection
      # and Code-Review are scored. Without these it fails setup outright with
      # "Resource not accessible by integration" — the failure looks like a
      # visibility or entitlement problem and is neither.
      pull-requests: read
      issues: read
      checks: read

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # See the note at the top of this file before changing.
          publish_results: true

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 30

      - name: Upload to code scanning
        # Needs GitHub Code Security while the repository is internal or private.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          sarif_file: scorecard-results.sarif
