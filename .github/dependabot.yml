version: 2

# Tuned after two individually-green Dependabot pull requests (jest-dom 6 -> 7
# and vitest 3 -> 4) merged into a broken lockfile and took master red. The
# volume was a symptom; the cause was major upgrades arriving unbidden and
# landing concurrently.
#
# Note what this file does NOT control: security updates. Those are advisory-
# driven and ignore `schedule` and `groups`. Nothing here delays a fix for a
# known vulnerability — the `ignore` rules below are scoped to
# `version-update:` precisely so they cannot.

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      # Weekly for production. This tree is small and the blast radius of a
      # stale runtime dependency is larger than the cost of reviewing it.
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope

    ignore:
      # Major upgrades of build tooling are taken deliberately, not on a
      # schedule. vitest 3 -> 4 was fine on its own; arriving unannounced
      # alongside another major is what broke the lockfile. Run
      # `pnpm outdated` when there is appetite for one, and bump it in a
      # pull request whose only job is that upgrade.
      #
      # Named, because `ignore` has no dependency-type filter; the earlier
      # form with one was invalid and stopped Dependabot parsing this file at
      # all. Packages that must track another package's major, such as
      # eslint-config-next tracking next and @types/react tracking react,
      # are deliberately not listed.
      #
      # Scoped to `version-update:` — a major that fixes a security advisory
      # still arrives immediately.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/eslintrc"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "playwright"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prettier"
        update-types: ["version-update:semver-major"]

    groups:
      # Grouped by dependency type and update size rather than by package name.
      # Matching on dependency-type catches everything, including packages added
      # later that nobody remembers to add to a pattern list.
      #
      # Production majors stay individual: they are the ones that need reading.
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/"
    schedule:
      # Monthly. The base image is pinned by digest, so an unapplied update is a
      # stale pin rather than an exposure; advisory-driven updates ignore this.
      interval: monthly
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      # Monthly. Actions are SHA-pinned, so an unapplied update is a stale pin
      # rather than an exposure, and the weekly cadence was pure noise.
      interval: monthly
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
